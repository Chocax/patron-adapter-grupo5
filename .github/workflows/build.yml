name: Compilar y probar

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar
        run: javac -encoding UTF-8 -d out $(find src -name "*.java")

      - name: Arrancar el servidor
        run: |
          nohup java -cp out app.Main > servidor.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:14080/api/plataformas && break
            sleep 1
          done

      - name: Probar que los adapters funcionan
        run: |
          set -e
          echo "Pedido de Rappi -> debe pasar por RappiAdapter"
          curl -sf -X POST http://localhost:14080/api/pedidos/rappi | grep -q '"adapter":"RappiAdapter"'

          echo "Pedido de DiDi -> debe pasar por DidiAdapter"
          curl -sf -X POST http://localhost:14080/api/pedidos/didi | grep -q '"adapter":"DidiAdapter"'

          echo "La cocina debe tener 2 pedidos"
          test "$(curl -sf http://localhost:14080/api/cocina | grep -o '"codigo"' | wc -l)" -eq 2

          echo "Todo bien ✅"

      - name: Ver la consola del servidor
        if: always()
        run: cat servidor.log
